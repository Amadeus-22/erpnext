name: Semantic Commits

on:
  pull_request: {}

permissions:
  contents: read

concurrency:
  group: commitcheck-erpnext-${{ github.event.number }}
  cancel-in-progress: true

jobs:
  commitlint:
    name: Check Commit Titles
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 200

      - uses: actions/setup-node@v6
        with:
          node-version: 18
          check-latest: true

      - name: Check commit titles
        run: |
          npm install @commitlint/cli @commitlint/config-conventional
          # Only lint commits that actually change files; empty commits (e.g. planning
          # placeholders created by automation) do not need a conventional-commit prefix.
          failed=0
          while IFS= read -r sha; do
            if git diff-tree --no-commit-id -r "$sha" | grep -q .; then
              git log -1 --format="%B" "$sha" | npx commitlint --verbose || failed=1
            fi
          done < <(git log --format="%H" \
            ${{ github.event.pull_request.base.sha }}..${{ github.event.pull_request.head.sha }})
          exit "$failed"
